<!DOCTYPE html>
<!-- サイト紹介動画（約19秒）。render(t) が時刻 t 秒の1コマを描く。capture.js がコマごとに撮って ffmpeg で動画にする -->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TGR受賞歴 紹介動画</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Shippori+Mincho:wght@400;500;700&display=swap" rel="stylesheet">
<script src="data.js"></script>
<style>
  :root {
    --desk: #f5f5f7; --paper: #fff; --ink: #1d1d1f; --muted: #6e6e73; --rule: #d2d2d7; --vermilion: #d70015;
    --serif: "Shippori Mincho", serif; --display: "Cormorant Garamond", serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--desk); color: var(--ink); font-family: var(--serif); }
  .scene { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .paper { position: absolute; background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 40px 80px -40px rgba(0,0,0,.3); overflow: hidden; }
  .paper::before { content: ""; position: absolute; inset: 22px; border: 1px solid var(--rule); pointer-events: none; z-index: 2; }
  .eyebrow { font-size: 26px; letter-spacing: .12em; color: var(--muted); }
  .redline { height: 2px; background: var(--vermilion); }
  .caption { position: absolute; }
  .caption .big { font-size: 78px; font-weight: 500; line-height: 1.35; letter-spacing: .02em; }
  .caption .big span { display: block; }
  .caption .sub { margin-top: 28px; font-size: 28px; color: var(--muted); letter-spacing: .06em; line-height: 1.7; }
  .num { font-family: var(--display); font-weight: 300; font-variant-numeric: lining-nums tabular-nums; }

  /* 1 表紙 */
  #s1 .years { font-size: 230px; line-height: 1; margin: 30px 0 10px; }
  #s1 .years span { display: inline-block; }
  #s1 .years .dash { color: var(--muted); margin: 0 .12em; }
  #s1 h1 { font-size: 92px; font-weight: 500; letter-spacing: .06em; margin-top: 46px; }

  /* 2 1年1ページ */
  #s2 .stack { left: 1060px; top: 110px; width: 660px; height: 860px; }
  #s2 .ghost { position: absolute; background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  #s2 .win { position: absolute; left: 0; right: 0; top: 220px; height: 300px; overflow: hidden; }
  #s2 .slot { position: absolute; left: 0; right: 0; top: 0; height: 300px; text-align: center; font-size: 280px; line-height: 300px; }
  #s2 .kai { position: absolute; left: 0; right: 0; top: 550px; text-align: center; font-size: 34px; color: var(--muted); letter-spacing: .14em; }
  #s2 .folio { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font-size: 26px; color: var(--muted); letter-spacing: .3em; }

  /* 3 年のページ */
  #s3 .page { left: 160px; top: 60px; width: 900px; height: 960px; padding: 80px 90px; }
  #s3 .head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 10px; margin-bottom: 30px; }
  #s3 .head .eyebrow { flex-basis: 100%; margin-bottom: 4px; font-size: 22px; }
  #s3 .head .num { font-size: 150px; line-height: .9; }
  #s3 .head .unit { font-size: 40px; }
  #s3 .head .label { flex-basis: 100%; font-size: 20px; color: var(--muted); margin-top: 14px; }
  #s3 .row { display: grid; grid-template-columns: 250px 1fr; gap: 24px; padding: 15px 0; border-top: 1px solid var(--rule); align-items: baseline; }
  #s3 .row .award { font-size: 19px; color: var(--muted); letter-spacing: .04em; }
  #s3 .row.grand .award { color: var(--vermilion); font-weight: 700; }
  #s3 .row .name { font-size: 27px; font-weight: 500; line-height: 1.35; }
  #s3 .row.grand .name { font-size: 34px; font-weight: 700; }
  #s3 .row .work { font-size: 18px; color: var(--muted); margin-top: 2px; }
  #s3 .caption { left: 1170px; top: 330px; }

  /* 4 目次 */
  #s4 .page { left: 860px; top: 60px; width: 900px; height: 960px; padding: 80px 90px; }
  #s4 h2 { font-size: 44px; font-weight: 500; letter-spacing: .3em; }
  #s4 .cols { display: grid; grid-template-columns: 120px 1fr 60px; font-size: 18px; color: var(--muted); margin: 26px 0 8px; letter-spacing: .1em; }
  #s4 .cols span:last-child, #s4 .folio { text-align: right; }
  #s4 .window { position: absolute; left: 90px; right: 90px; top: 230px; bottom: 60px; overflow: hidden;
    -webkit-mask-image: linear-gradient(transparent, #000 6%, #000 88%, transparent); }
  #s4 .list { position: absolute; left: 0; right: 0; top: 0; }
  #s4 .tr { display: grid; grid-template-columns: 120px 1fr 60px; height: 96px; align-items: center; border-top: 1px solid var(--rule); }
  #s4 .tr .num { font-size: 44px; }
  #s4 .tr .name { font-size: 27px; font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #s4 .tr .work { font-size: 17px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #s4 .tr.hot .name { color: var(--vermilion); }
  #s4 .tr .folio { color: var(--muted); font-size: 30px; }
  #s4 .caption { left: 160px; top: 330px; }

  /* 5 数字と出典 */
  #s5 .stats { display: flex; gap: 150px; align-items: flex-end; }
  #s5 .stat { text-align: center; }
  #s5 .stat .num { font-size: 210px; line-height: 1; display: block; }
  #s5 .stat .lab { font-size: 34px; letter-spacing: .12em; color: var(--muted); margin-top: 18px; display: block; }
  #s5 .stat.red .num { color: var(--vermilion); }
  #s5 .chips { display: flex; gap: 18px; margin-top: 100px; }
  #s5 .chip { font-size: 26px; padding: 12px 26px; border: 1px solid var(--rule); background: var(--paper); letter-spacing: .06em; }
  #s5 .note { margin-top: 44px; font-size: 30px; color: var(--muted); letter-spacing: .08em; }

  /* 6 終わり */
  #s6 h1 { font-size: 110px; font-weight: 500; letter-spacing: .06em; }
  #s6 .url { font-family: var(--display); font-weight: 500; font-size: 76px; letter-spacing: .04em; margin-top: 28px; }
  #s6 .foot { font-size: 26px; color: var(--muted); letter-spacing: .14em; margin-top: 40px; }
</style>
</head>
<body>

<section class="scene center" id="s1">
  <p class="eyebrow" id="s1e">札幌劇場祭 TGR　第1回 – 第20回</p>
  <p class="years num" id="s1y"></p>
  <div class="redline" id="s1l"></div>
  <h1 id="s1h">TGR札幌劇場祭 受賞歴</h1>
</section>

<section class="scene" id="s2">
  <div class="caption" style="left:160px;top:350px">
    <p class="big"><span id="s2a">20年分の受賞を、</span><span id="s2b">1年1ページに。</span></p>
    <p class="sub" id="s2c">2006年の第1回から、2025年の第20回まで</p>
  </div>
  <div class="ghost" style="left:1080px;top:126px;width:660px;height:860px"></div>
  <div class="ghost" style="left:1070px;top:118px;width:660px;height:860px"></div>
  <div class="paper stack" id="s2p">
    <div class="win"><div class="slot num" id="s2o"></div><div class="slot num" id="s2n"></div></div>
    <div class="kai" id="s2k"></div>
    <div class="folio" id="s2f"></div>
  </div>
</section>

<section class="scene" id="s3">
  <div class="paper page" id="s3p">
    <div class="head">
      <p class="eyebrow">第20回</p>
      <span class="num">2025</span><span class="unit">年</span>
      <p class="label" id="s3label"></p>
    </div>
    <div id="s3rows"></div>
  </div>
  <div class="caption">
    <p class="big"><span id="s3a">受賞者と作品を、</span><span id="s3b">賞ごとに一覧で。</span></p>
    <p class="sub" id="s3c">大賞・優秀賞・新人賞・俳優賞<br>オーディエンス賞まで</p>
  </div>
</section>

<section class="scene" id="s4">
  <div class="caption">
    <p class="big"><span id="s4a">目次で、</span><span id="s4b">歴代の大賞を一望。</span></p>
    <p class="sub" id="s4c">年を選べば、その年のページへ</p>
  </div>
  <div class="paper page" id="s4p">
    <h2>目次</h2>
    <p class="cols"><span>年</span><span>大賞</span><span>頁</span></p>
    <div class="window"><div class="list" id="s4list"></div></div>
  </div>
</section>

<section class="scene center" id="s5">
  <div class="stats">
    <div class="stat"><span class="num" id="n1">0</span><span class="lab">年分</span></div>
    <div class="stat"><span class="num" id="n2">0</span><span class="lab">件の受賞</span></div>
    <div class="stat red"><span class="num" id="n3">0</span><span class="lab">件の出典</span></div>
  </div>
  <div class="chips" id="s5chips"></div>
  <p class="note" id="s5n">すべての年に出典リンク。賞のしくみの解説つき</p>
</section>

<section class="scene center" id="s6">
  <h1 id="s6h">TGR札幌劇場祭 受賞歴</h1>
  <div class="redline" id="s6l" style="margin-top:40px"></div>
  <p class="url" id="s6u">tgr.iq5000.jp</p>
  <p class="foot" id="s6f">非公式のまとめ</p>
</section>

<script>
const D = window.DATA;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const outC = x => 1 - Math.pow(1 - x, 3);
const inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
// 下からふわっと出す
const rise = (el, p, dist = 30) => { el.style.opacity = p; el.style.transform = `translateY(${(1 - outC(p)) * dist}px)`; };
// 場面の出入り：a で入り始め、b で消え始める
const scene = (el, t, a, b, fade = .4) => {
  const o = Math.min(seg(t, a, a + fade), 1 - seg(t, b, b + fade));
  el.style.opacity = o;
  el.style.visibility = o > 0 ? 'visible' : 'hidden';
  return t - a;
};

// --- 下ごしらえ ---
$('s1y').innerHTML = [...'2006'].map(c => `<span>${c}</span>`).join('') + '<span class="dash">–</span>' + [...'2025'].map(c => `<span>${c}</span>`).join('');
const years = Array.from({ length: 20 }, (_, i) => 2006 + i);
$('s3label').textContent = D.y2025.label;
$('s3rows').innerHTML = D.y2025.rows.slice(0, 6).map(r =>
  `<div class="row${r.grand ? ' grand' : ''}"><span class="award">${r.award}</span><div><p class="name">${r.name}</p>${r.work ? `<p class="work">${r.work}</p>` : ''}</div></div>`).join('');
$('s4list').innerHTML = D.toc.map((r, i) =>
  `<div class="tr"><span class="num">${r.year}</span><span><span class="name">${r.name}</span><span class="work">${r.work}</span></span><span class="folio num">${20 - i}</span></div>`).join('');
$('s5chips').innerHTML = ['大賞', '優秀賞', '審査員賞', '新人賞', '俳優賞', 'オーディエンス賞'].map(c => `<span class="chip">${c}</span>`).join('');

const DURATION = 19;

function render(t) {
  // 1 表紙 0–3.2
  let l = scene($('s1'), t, -1, 2.9);
  rise($('s1e'), seg(l, 1.15, 1.75));
  [...$('s1y').children].forEach((s, i) => rise(s, seg(l, 1.0 + i * .07, 1.6 + i * .07), 60));
  $('s1l').style.width = outC(seg(l, 1.8, 2.5)) * 320 + 'px';
  rise($('s1h'), seg(l, 2.1, 2.8));
  $('s1').style.transform = `scale(${1 + seg(t, 2.9, 3.3) * .04})`;

  // 2 1年1ページ 3.0–6.8
  l = scene($('s2'), t, 3.0, 6.6);
  rise($('s2a'), seg(l, .1, .6)); rise($('s2b'), seg(l, .3, .8)); rise($('s2c'), seg(l, .6, 1.1));
  $('s2p').style.transform = `translateX(${(1 - outC(seg(l, 0, .7))) * 120}px)`;
  const flip = inOut(seg(l, .7, 3.2)) * 19;
  const i = Math.min(19, Math.floor(flip)), f = i === 19 ? 0 : inOut(flip - i);
  $('s2o').textContent = years[i];
  $('s2o').style.transform = `translateY(${-f * 300}px)`;
  $('s2n').textContent = i < 19 ? years[i + 1] : '';
  $('s2n').style.transform = `translateY(${(1 - f) * 300}px)`;
  const cur = years[f > .5 ? i + 1 : i];
  $('s2k').textContent = `第${cur - 2005}回`;
  $('s2f').textContent = `— ${cur - 2005} —`;

  // 3 年のページ 6.6–10.8
  l = scene($('s3'), t, 6.6, 10.6);
  $('s3p').style.transform = `translateY(${(1 - outC(seg(l, 0, .8))) * 60}px) scale(${.97 + outC(seg(l, 0, 4)) * .03})`;
  [...$('s3rows').children].forEach((r, k) => rise(r, seg(l, .5 + k * .16, 1.0 + k * .16), 24));
  rise($('s3a'), seg(l, .6, 1.1)); rise($('s3b'), seg(l, .8, 1.3)); rise($('s3c'), seg(l, 1.2, 1.7));

  // 4 目次 10.6–14.2
  l = scene($('s4'), t, 10.6, 14.0);
  $('s4p').style.transform = `translateY(${(1 - outC(seg(l, 0, .8))) * 60}px)`;
  const maxScroll = 20 * 96 - 670;
  const y = inOut(seg(l, .6, 3.4)) * maxScroll;
  $('s4list').style.transform = `translateY(${-y}px)`;
  const hot = Math.round((y + 300) / 96 - .5);
  [...$('s4list').children].forEach((r, k) => r.classList.toggle('hot', k === hot && l > .6));
  rise($('s4a'), seg(l, .3, .8)); rise($('s4b'), seg(l, .5, 1.0)); rise($('s4c'), seg(l, .9, 1.4));

  // 5 数字と出典 14.0–16.8
  l = scene($('s5'), t, 14.0, 16.5);
  const c = outC(seg(l, .2, 1.4));
  $('n1').textContent = Math.round(20 * c);
  $('n2').textContent = Math.round(D.rows * c);
  $('n3').textContent = Math.round(D.sources * c);
  [...document.querySelectorAll('#s5 .stat')].forEach((s, k) => rise(s, seg(l, .05 + k * .1, .55 + k * .1), 40));
  [...$('s5chips').children].forEach((s, k) => rise(s, seg(l, 1.0 + k * .08, 1.4 + k * .08), 20));
  rise($('s5n'), seg(l, 1.5, 1.9));

  // 6 終わり 16.5–19
  l = scene($('s6'), t, 16.5, 99);
  rise($('s6h'), seg(l, .1, .7));
  $('s6l').style.width = outC(seg(l, .5, 1.1)) * 320 + 'px';
  rise($('s6u'), seg(l, .8, 1.3));
  rise($('s6f'), seg(l, 1.1, 1.6));
}

window.render = render;
window.DURATION = DURATION;
// ブラウザで直接開いたときはそのまま再生する
if (!location.search.includes('capture')) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); })();
} else {
  render(0);
}
</script>
</body>
</html>
